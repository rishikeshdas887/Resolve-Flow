name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: resolveflow
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: resolveflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resolveflow -d resolveflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://resolveflow:ci@localhost:5432/resolveflow
      TEST_DATABASE_URL: postgresql+psycopg://resolveflow:ci@localhost:5432/resolveflow_test
      EVAL_DATABASE_URL: postgresql+psycopg://resolveflow:ci@localhost:5432/resolveflow_eval
      LLM_PROVIDER: deterministic
      EMBEDDING_PROVIDER: deterministic
      ENVIRONMENT: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests scripts migrations

      - name: Create test databases
        run: |
          PGPASSWORD=ci psql -h localhost -U resolveflow -d postgres \
            -c "CREATE DATABASE resolveflow_test" \
            -c "CREATE DATABASE resolveflow_eval"

      - name: Migrations — upgrade from empty DB
        run: alembic upgrade head
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Migrations — downgrade and re-upgrade cycle
        run: |
          alembic downgrade base
          alembic upgrade head
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Unit and integration tests (pytest)
        run: pytest tests/ -q

      - name: Deterministic evaluation suite
        run: |
          alembic upgrade head
          python scripts/evaluate.py --dataset evals/dataset.jsonl
        env:
          DATABASE_URL: ${{ env.EVAL_DATABASE_URL }}
