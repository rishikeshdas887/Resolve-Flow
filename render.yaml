services:
  - type: web
    name: resolve-flow
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/live
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: resolve-flow-db
          property: connectionString
      - key: ENVIRONMENT
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://resolveflow.vercel.app,https://frontend-rishidas887s-projects.vercel.app,https://frontend-three-bice-94.vercel.app,http://localhost:5173,http://localhost:3000
      - key: LLM_PROVIDER
        value: auto
      - key: OPENAI_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        value: auto
      - key: SEED_ADMIN_EMAIL
        value: admin@example.com
      - key: SEED_ADMIN_PASSWORD
        value: AdminPass123!
      - key: SEED_AGENT_EMAIL
        value: agent@example.com
      - key: SEED_AGENT_PASSWORD
        value: AgentPass123!

databases:
  - name: resolve-flow-db
    plan: free
    databaseName: resolveflow
    user: resolveflow
